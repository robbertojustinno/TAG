<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="./locale.js?v=20261102-i18n"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TagCheck Admin</title>
  <link rel="stylesheet" href="./admin-layout.css?v=20261103-header" />
  <script src="./theme.js?v=20261102-i18n"></script>
  <link rel="icon" type="image/png" href="./public/favicon.png">
<link rel="apple-touch-icon" href="./public/favicon.png">
  <link rel="stylesheet" href="./maintenance.css?v=20261104-upload">
</head>
<body>
  <div class="app-shell">
    <header class="topbar card">
      <div class="brand">
       <img src="./public/logo.png" alt="Rovix Automation" class="brand-logo" />
        <div>
          <h1 id="brandTitle"><span data-tc-text="TagCheck • Smart Asset Tracking">TagCheck • Smart Asset Tracking</span></h1>
          <p id="brandSubtitle"><span data-tc-text="Powered by Rovix Automation™ ⚡">Powered by Rovix Automation™ ⚡</span></p>
          <p id="activeCompany" class="hidden" aria-live="polite"></p>
          <p id="activeUserProfile" class="hidden" aria-live="polite"></p>
        </div>
      </div>

      <nav class="topbar-actions" aria-label="Ações do TagCheck" data-tc-aria-label="Ações do TagCheck">
        <div class="language-switch" role="group" aria-label="Idioma" data-tc-aria-label="Idioma">
<button type="button" id="langPt" class="outline-button lang-button" data-tc-language="pt" lang="pt-BR">Português</button>
<button type="button" id="langEn" class="outline-button lang-button" data-tc-language="en" lang="en">English</button>
<button type="button" id="langEs" class="outline-button lang-button" data-tc-language="es" lang="es">Español</button>
</div>
        <button id="themeToggle" type="button" class="outline-button" aria-pressed="false"><span data-tc-text="Tema claro">Tema claro</span></button>
        <div class="workspace-actions">
        <a id="openViewerButton" class="secondary-button" href="#" target="_blank" rel="noopener noreferrer"><span data-tc-text="Viewer">Viewer</span></a>
        <a id="openCampoButton" class="primary-button hidden" href="#" target="_blank" rel="noopener noreferrer"><span data-tc-text="Cadastro Offline">Cadastro Offline</span></a>
        <a id="openTaggingButton" class="secondary-button hidden" href="./tagueamento/"><span data-tc-text="Tagueamento">Tagueamento</span></a>
        <button id="maintenanceButton" class="outline-button hidden" type="button">Manutenção preventiva</button>
        <button id="companyAdminButton" class="outline-button hidden"><span data-tc-text="Administração">Administração</span></button>
        <button id="superadminButton" class="outline-button hidden">Super Admin</button>
        </div>
        <button id="logoutButton" class="outline-button hidden"><span data-tc-text="Sair">Sair</span></button>
      </nav>
    </header>

    <main class="app-main" id="app">
      <section class="screen">
        <div class="card panel">
          <div class="center-row">
            <div class="loader"></div>
            <span><span data-tc-text="Carregando Admin...">Carregando Admin...</span></span>
          </div>
        </div>
      </section>
    </main>
  </div>


  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => null);
      });
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
  <script src="./config.js?v=20260915-asset-categories"></script>
  <script src="./company-admin.js?v=20261102-i18n"></script>
  <script src="./billing-production.js?v=20261102-i18n"></script>
  <script src="./superadmin.js?v=20261102-i18n"></script>
  <script src="./offline-store.js?v=20261006-storage-fallback"></script>
  <script src="./calibration.js?v=20261102-i18n"></script>
  <script src="./customer-access.js?v=20261102-i18n"></script>
  <script src="./app.js?v=20261103-maintenance-page"></script>
  <script src="./maintenance.js?v=20261104-upload"></script>
  <script src="./offline-integration.js?v=20261102-i18n"></script>
  <div class="footer-note">
    Powered by Rovix Automation™ • Roberto Justino
  </div>
</body>
</html>
